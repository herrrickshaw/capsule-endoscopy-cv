[project]
name = "capsule-cv"
version = "0.1.0"
description = "Classical-CV triage and reporting for wireless capsule endoscopy (research use only)"
requires-python = ">=3.9"
dependencies = ["opencv-python-headless>=4.8", "numpy>=1.24"]

[tool.setuptools]
packages = ["capsule_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
